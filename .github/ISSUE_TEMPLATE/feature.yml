name: "📋 Nueva tarea / Mejora"
description: "Proponer una nueva funcionalidad o mejora"
title: "[Frontend] - "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## 📋 Nueva tarea / Mejora

  - type: textarea
    id: descripcion
    attributes:
      label: "🔍 Descripción"
      description: "¿Qué hay que hacer y por qué?"
      placeholder: |
        Ejemplo: El botón de ubicación ocupa demasiado espacio con el texto. Debería ser solo el icono, estilo Google Maps.
    validations:
      required: true

  - type: dropdown
    id: modulo
    attributes:
      label: "📍 Módulo"
      options:
        - "BookSpots"
        - "Matcher"
        - "Chats"
        - "Comunidades"
        - "Biblioteca"
        - "Perfil"
        - "Autenticación"
        - "Premium / Pagos"
        - "Diseño UX/UI"
        - "Infraestructura"
        - "Documentación"
        - "➕ Otro (especificar abajo)"
    validations:
      required: true

  - type: input
    id: otro-modulo
    attributes:
      label: "➕ Otro módulo"
      placeholder: "Ej: Notificaciones push"
    validations:
      required: false

  - type: dropdown
    id: prioridad
    attributes:
      label: "⚠️ Prioridad"
      options:
        - "🔥 Urgente — Bloquea otras tareas"
        - "🔴 Alta — Debería hacerse lo antes posible"
        - "🟡 Media — Importante pero no urgente"
        - "🟢 Baja — Detalle menor o cosmético"
    validations:
      required: true

  - type: dropdown
    id: sprint
    attributes:
      label: "🏃 Sprint"
      options:
        - "DP"
        - "Sprint 1"
        - "Sprint 2"
        - "Sprint 3"
        - "PPL"
        - "WPL"
    validations:
      required: true

  - type: textarea
    id: archivos
    attributes:
      label: "📁 Archivos / Componentes afectados (opcional)"
      placeholder: |
        Ej:
        - app/(tabs)/bookspots.tsx
        - components/communities/CommunityChatTab.tsx
    validations:
      required: false
